name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# id-token: write is required for OIDC — without it, GitHub never issues
# the JSON Web Token that AWS's identity provider needs to see.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC context
        run: |
          echo "repository: ${{ github.repository }}"
          echo "ref: ${{ github.ref }}"
          echo "event: ${{ github.event_name }}"

      - name: Debug - decode actual OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import sys, base64, json
          s = sys.argv[1]
          s += '=' * (-len(s) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(s)), indent=2))
          " "$(echo $IDTOKEN | cut -d. -f2)"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::379549361194:role/capstone-9-github-actions-deploy
          aws-region: us-east-1

      - name: Verify assumed identity (no static keys involved)
        run: aws sts get-caller-identity

      - name: Package the evaluator Lambda
        run: |
          cd lambda/evaluator
          zip -r ../../function.zip .

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name capstone-9-finding-evaluator \
            --zip-file fileb://function.zip
